name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Web, worker and PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:f1ea2a1a4fb7b68d4836be1fdcb8a6466a89b072158bf9d97663600538c294c5
        env:
          POSTGRES_USER: lifeos_test
          POSTGRES_DB: lifeos_test_ci
          # Disposable runner service with synthetic fixtures only; no stored credentials.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U lifeos_test -d lifeos_test_ci"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install pinned pnpm from packageManager
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
      - name: Install pinned Node and cache pnpm store
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Frozen install, lint, types, unit, test migrations, integration, builds and smoke
        env:
          TEST_DATABASE_URL: postgresql://lifeos_test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/lifeos_test_ci
        run: pnpm verify
